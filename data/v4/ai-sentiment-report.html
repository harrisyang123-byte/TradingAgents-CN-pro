// ── Score → color class ──
function scoreClass(s) {
  if (s >= 83) return 'score-85';
  if (s >= 79) return 'score-80';
  if (s >= 76) return 'score-78';
  if (s >= 70) return 'score-72';
  if (s >= 65) return 'score-68';
  if (s >= 60) return 'score-62';
  if (s >= 55) return 'score-60';
  return 'score-45';
}
function barClass(s) {
  if (s >= 78) return 'bar-85';
  if (s >= 68) return 'bar-72';
  if (s >= 58) return 'bar-60';
  return 'bar-45';
}

// ── Sentiment → dot ──
function sentiDot(s) {
  if (!s) return '';
  if (s.includes('bear')) return '<span class="senti-dot senti-bear"></span>';
  if (s.includes('mixed') || s.includes('short')) return '<span class="senti-dot senti-mixed"></span>';
  return '<span class="senti-dot senti-bull"></span>';
}

// ── Render ──
function render() {
  const d = DATA;

  // Header stats
  document.getElementById('hBull').textContent = d.overall.bull_count;
  document.getElementById('hBear').textContent = d.overall.bear_count;
  document.getElementById('hNeutral').textContent = d.overall.neutral_count;

  // Overall ring
  const circumference = 2 * Math.PI * 50; // ~314
  const filled = (d.overall.score / 100) * circumference;
  const ring = document.getElementById('ringFill');
  const scoreColor = d.overall.score >= 70 ? '#facc15' : d.overall.score >= 55 ? '#fb923c' : '#f87171';
  ring.setAttribute('stroke', scoreColor);
  setTimeout(() => {
    ring.setAttribute('stroke-dasharray', `${filled} ${circumference - filled}`);
  }, 100);

  document.getElementById('overallScore').textContent = d.overall.score;
  document.getElementById('overallLabel').textContent = d.overall.label;
  document.getElementById('overallSummary').textContent = d.overall.summary;
  document.getElementById('bullBear').innerHTML = `
    <div class="bb-item"><span class="bb-dot" style="background:#34d399"></span>${d.overall.bull_count} 多头信号</div>
    <div class="bb-item"><span class="bb-dot" style="background:#f87171"></span>${d.overall.bear_count} 空头信号</div>
    <div class="bb-item"><span class="bb-dot" style="background:#888"></span>${d.overall.neutral_count} 中性观察</div>
  `;

  // Sub-sectors
  const grid = document.getElementById('sectorsGrid');
  d.sub_sectors.forEach((sec, i) => {
    const card = document.createElement('div');
    card.className = 'sector-card';

    const eventsHtml = sec.key_events.map(e =>
      `<div class="event-item">${e}</div>`
    ).join('');

    const stocksHtml = sec.stocks_mentioned.map(s =>
      `<span class="stock-tag">${s}</span>`
    ).join('');

    card.innerHTML = `
      <div class="sector-header">
        <div class="sector-score ${scoreClass(sec.score)}">${sec.score}</div>
        <div class="sector-info">
          <h3>${sec.name}</h3>
          <div class="signal signal-${sec.signal}">${sec.signal.replace(/_/g,' ')}</div>
        </div>
      </div>
      <div class="sector-bar-wrap">
        <div class="sector-bar ${barClass(sec.score)}" style="width:${sec.score}%"></div>
      </div>
      <div class="sector-stocks">${stocksHtml}</div>
      <div class="expand-hint">点击展开事件详情 ▸</div>
      <div class="sector-events">
        <div style="font-size:12px;color:#666;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;">本周关键事件</div>
        ${eventsHtml}
        <div class="sector-risk-opp">
          <div class="ro-box ro-risk"><div class="ro-title">风险</div><p>${sec.risk}</p></div>
          <div class="ro-box ro-opp"><div class="ro-title">机会</div><p>${sec.opportunity}</p></div>
        </div>
      </div>
    `;

    card.addEventListener('click', () => {
      card.classList.toggle('expanded');
    });

    grid.appendChild(card);
  });

  // Hot signals
  const sigList = document.getElementById('signalsList');
  d.hot_signals.forEach(sig => {
    const div = document.createElement('div');
    div.className = 'signal-card';

    const sentDot = sentiDot(sig.sentiment);

    div.innerHTML = `
      <div class="signal-type-badge badge-${sig.type}">${sig.type.replace('_',' ')}</div>
      <div class="signal-body">
        <h4>${sentDot}${sig.signal}</h4>
        <p>${sig.detail}</p>
      </div>
      ${sig.date ? `<div class="signal-date">${sig.date}</div>` : ''}
    `;
    sigList.appendChild(div);
  });

  // Macro risks
  const risksGrid = document.getElementById('risksGrid');
  d.macro_risks.forEach(r => {
    const div = document.createElement('div');
    div.className = 'risk-card';
    div.innerHTML = `
      <div class="risk-header">
        <span class="risk-sev sev-${r.severity}">${r.severity}</span>
        <h4>${r.risk}</h4>
      </div>
      <p>${r.detail}</p>
    `;
    risksGrid.appendChild(div);
  });

  // Smart money
  const sm = d.smart_money_posture;
  const posHtml = sm.key_positions.map(p => {
    const cls = p.startsWith('Long') ? 'pos-long' : p.startsWith('Short') ? 'pos-short' : 'pos-watch';
    const text = p.replace(/^(Long|Short|Watch): /, '');
    return `<div class="pos-item ${cls}">${text}</div>`;
  }).join('');
  document.getElementById('smartCard').innerHTML = `
    <p class="sm-summary">${sm.summary}</p>
    <div class="positions-list">${posHtml}</div>
  `;

  // Source note
  document.getElementById('sourceNote').textContent = d.data_source + ' · Generated ' + d.generated_at;
}

render();
</script>
